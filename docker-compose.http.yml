version: "3.8"

services:
  nginx:
    image: nginx:alpine
    container_name: nginx-http
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/conf.d/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/logs:/var/log/nginx
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - nginx-network

networks:
  nginx-network:
    driver: bridge

