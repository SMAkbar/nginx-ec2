version: "3.8"

services:
  nginx:
    image: nginx:alpine
    container_name: nginx-https
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx-https/conf.d/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx-https/logs:/var/log/nginx
      - ./nginx-https/certbot/conf:/etc/letsencrypt
      - ./nginx-https/certbot/www:/var/www/certbot
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - nginx-network
    command: "/bin/sh -c 'while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g \"daemon off;\"'"

  certbot:
    image: certbot/certbot
    container_name: certbot
    restart: unless-stopped
    volumes:
      - ./nginx-https/certbot/conf:/etc/letsencrypt
      - ./nginx-https/certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - nginx-network

networks:
  nginx-network:
    driver: bridge

